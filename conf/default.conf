server {
	listen		8080;
	host		localhost;
	server_name	webserv;

	root		www/public;
	index		index.html;

	client_max_body_size 1048576;

	error_page 404 www/errors/404.html;
	error_page 405 www/errors/405.html;

	location / {
		allowed_methods	GET;
		autoindex 		off;
	}

	location /cgi-bin {
		allowed_methods		GET POST;
		cgi_extension		.py;
		cgi_interpreter		/usr/bin/python3;
		root				cgi-bin;
	}

	location /admin {
		allowed_methods	GET;
		root			www/admin;
		autoindex		on;
	}

	location /data {
		allowed_methods	POST;
		root			www/data;
	}

	location /upload {
		allowed_methods GET POST DELETE;
		root			www/uploads;
		upload_dir		www/uploads;
	}
}
